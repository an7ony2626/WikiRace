name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'  # ogni lunedì e giovedì alle 6:00 UTC
  workflow_dispatch:        # per poterlo lanciare a mano e testarlo subito

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "${{ secrets.SUPABASE_DB_URL }}" -c "select 1;"