spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Must stay validate, matching schema.sql's own header comment: the app
# should fail fast on a schema mismatch, never silently alter the live
# production schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JwtService reads the signing key from JWT_KEY directly (relaxed
# binding picks up the env var of the same name) — there is no
# "jwt.secret" property to set here.

server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Prod frontend and backend are cross-origin, so the JWT cookie needs
# SameSite=None (requires Secure) to be sent at all.
cookie.secure=true
cookie.samesite=None