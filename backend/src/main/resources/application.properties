spring.application.name=demo

# --- Datasource: adapt these 3 values to the DB you created in pgAdmin ---
spring.datasource.url=jdbc:postgresql://localhost:5432/roadtounina
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- Hibernate: validate against schema.sql, do not generate/modify anything ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view: without this, Spring keeps a Hibernate session
# open for the entire HTTP request automatically, hiding lazy-loading issues
# until they blow up in production. It is better to fail fast in development
# than to find out during a demo.
spring.jpa.open-in-view=false

# Only actually exercised if something calls the API directly instead of
# through nginx's same-origin proxy (see frontend/nginx.conf) — but
# SecurityConfig's CORS bean needs this property to resolve regardless,
# so it needs a value even when nothing cross-origin is really happening.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT cookie: dev frontend/backend are same-site via the Angular dev
# server's proxy, and plain http (no TLS) can't carry a Secure cookie
# at all. Prod overrides both (see application-prod.properties).
cookie.secure=false
cookie.samesite=Lax

# Wikipedia page content rarely changes mid-game; caching it briefly
# avoids re-fetching the same page from Wikipedia's API on every
# refresh/poll of the same game state.
spring.cache.cache-names=wikiPageContent
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=500